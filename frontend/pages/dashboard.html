<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Tansioco Round Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <nav class="sidebar" aria-label="Main menu">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div class="wordmark"><span class="wordmark-title">Tansioco</span><span class="wordmark-sub">ROUND TABLE</span></div>
      <button class="btn-close btn-close-white d-lg-none" onclick="toggleMenu()" aria-label="Close menu"></button>
    </div>
    <a href="dashboard.html" class="active" aria-current="page"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
    <a href="authorized-users.html" id="addUserLink"><i class="bi bi-people"></i>Authorized Users</a>
  </nav>

  <div class="content">
    <!-- TOP BAR -->
    <header class="topbar">
      <button class="btn-icon" onclick="toggleMenu()" aria-label="Show or hide the menu"><i class="bi bi-list"></i></button>
      <div class="wordmark d-lg-none"><span class="wordmark-title">Tansioco</span></div>
      <div class="input-group topbar-search d-none d-md-flex">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" class="form-control" id="searchInput" oninput="searchTable()" placeholder="Search recent orders" aria-label="Search recent orders">
      </div>
      <span class="ms-auto d-flex align-items-center gap-2">
        <span class="avatar" id="avatarLetter"></span>
        <span class="d-none d-md-inline small" id="userName"></span>
        <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Log out</button>
      </span>
    </header>

    <!-- PAGE CONTENT -->
    <main class="main">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Dashboard</h1>
        <span class="date-box"><i class="bi bi-calendar3 me-1"></i><span id="today"></span></span>
      </div>

      <section class="card-tr d-flex align-items-center gap-3 mb-3">
        <i class="bi bi-person-circle fs-1" style="color: var(--tr-maroon)"></i>
        <div>
          <h2 class="h5 mb-0">Welcome, <span id="welcomeName"></span>!</h2>
          <p class="mb-0 small text-muted">Here's an overview of your restaurant.</p>
        </div>
      </section>

      <section class="row g-3 mb-3" aria-label="Summary">
        <div class="col-6 col-lg-3"><div class="stat stat-maroon">
          <span class="stat-icon"><i class="bi bi-cup-hot"></i></span>
          <div><div class="stat-label">Total Products</div><div class="stat-value">120</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="stat stat-green">
          <span class="stat-icon"><i class="bi bi-clipboard-check"></i></span>
          <div><div class="stat-label">Total Orders</div><div class="stat-value">45</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="stat stat-orange">
          <span class="stat-icon"><i class="bi bi-people"></i></span>
          <div><div class="stat-label">Customers</div><div class="stat-value">32</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="stat stat-red">
          <span class="stat-icon"><i class="bi bi-cash-coin"></i></span>
          <div><div class="stat-label">Total Sales</div><div class="stat-value">₱12,500</div></div></div></div>
      </section>

      <div class="row g-3">
        <section class="col-12 col-lg-6">
          <div class="card-tr h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h2 class="h6 mb-0">Recent Orders</h2>
              <a href="order-history.html" class="small" style="color: var(--tr-red)">View All</a>
            </div>
            <div class="table-responsive">
              <table class="table table-tr" id="dataTable">
                <thead><tr><th>#</th><th>Customer</th><th>Date</th><th>Status</th></tr></thead>
                <tbody>
                </tbody>
              </table>
            </div>
          </div>
        </section>
        <section class="col-12 col-lg-6">
          <div class="card-tr h-100">
            <h2 class="h6 mb-2">Sales Overview</h2>
            </svg>
          </div>
        </section>
      </div>
    </main>
  </div>    

<!-- BOTTOM NAV: phones only -->
<nav class="bottom-nav d-lg-none" aria-label="Quick menu">
  <a href="dashboard.html" class="active"><i class="bi bi-house-door-fill"></i>Home</a>
  <a href="products.html"><i class="bi bi-box-seam"></i>Products</a>
  <a href="sales.html"><i class="bi bi-bar-chart-line"></i>Sales</a>
  <button onclick="toggleMenu()"><i class="bi bi-three-dots"></i>More</button>
</nav>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/menu.js"></script>
</body>
</html>
