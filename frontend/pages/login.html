<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Tansioco Round Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="wordmark mb-3">
        <span class="wordmark-title">Tansioco</span>
        <span class="wordmark-sub">ROUND TABLE</span>
      </div>
      <h1 class="h4 text-center mb-0">Login</h1>
      <p class="text-center text-muted small mb-3">Access your account</p>

      <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

      <!-- "required" it allowed browser to check empty fields for us -->
      <form onsubmit="return checkLogin()">
        <label for="username" class="form-label visually-hidden">Username</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
        </div>
        <label for="password" class="form-label visually-hidden">Password</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-tr w-100">Login</button>
      </form>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
