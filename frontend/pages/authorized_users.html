<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorized Users | Tansioco Round Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">

  <!-- SIDEBAR (it should be the same for every website pages for this) -->
  <nav class="sidebar" aria-label="Main menu">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div class="wordmark"><span class="wordmark-title">Tansioco</span><span class="wordmark-sub">ROUND TABLE</span></div>
      <button class="btn-close btn-close-white d-lg-none" onclick="toggleMenu()" aria-label="Close menu"></button>
    </div>
    <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
    <a href="authorized-users.html" class="active" aria-current="page" id="addUserLink"><i class="bi bi-people"></i>Authorized Users</a>
  </nav>

  <div class="content">
    <!-- TOP BAR (it should be the same for every website pages for this) -->
    <header class="topbar">
      <button class="btn-icon" onclick="toggleMenu()" aria-label="Show or hide the menu"><i class="bi bi-list"></i></button>
      <div class="wordmark d-lg-none"><span class="wordmark-title">Tansioco</span></div>
      <div class="input-group topbar-search d-none d-md-flex">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" class="form-control" id="searchInput" oninput="searchTable()" placeholder="Search users" aria-label="Search users">
      </div>
      <span class="ms-auto d-flex align-items-center gap-2">
        <span class="avatar" id="avatarLetter"></span>
        <span class="d-none d-md-inline small" id="userName"></span>
        <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Log out</button>
      </span>
    </header>

    <!-- PAGE CONTENT -->
    <main class="main">
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3 mb-0">Authorized Users</h1><button class="btn btn-tr" onclick="openAddUser()"><i class="bi bi-plus-lg"></i> Add User</button></div>
      <div id="demoMessage" class="alert alert-success d-none" role="status"></div>
      <div class="card-tr">
        <div class="table-responsive">
          <table class="table table-tr table-cards align-middle" id="dataTable">
            <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Created</th><th>Action</th></tr></thead>
            <tbody>
              <!-- Table rows will be dynamically generated here -->
            </tbody>
          </table>
        </div>
        <p id="noResults" class="text-muted d-none mb-0">No matching records. Try a different search.</p>
      </div>
      <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
        <div class="modal-dialog"><div class="modal-content">
          <form id="userForm" onsubmit="return saveUser()">
            <div class="modal-header"><h2 class="modal-title h5" id="userModalTitle">Add User</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <div class="modal-body">
              <div class="mb-3"><label for="uName" class="form-label">Username</label><input type="text" class="form-control" id="uName" name="username" maxlength="50" required></div>
              <div class="mb-3"><label for="uPassword" class="form-label">Password</label><input type="password" class="form-control" id="uPassword" name="password" autocomplete="new-password" required>
                <div class="form-text" id="pwHelp"></div></div>
              <div class="mb-3"><label for="uRole" class="form-label">Role</label><select class="form-select" id="uRole" name="role" required>
                <option value="admin">Admin</option><option value="manager">Manager</option><option value="cashier">Cashier</option></select></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-tr">Save user</button></div>
          </form>
        </div></div>
    </main>
  </div>
</div>

<!-- BOTTOM NAV (phones only) -->
<nav class="bottom-nav d-lg-none no-print" aria-label="Quick menu">
  <a href="dashboard.html"><i class="bi bi-house-door-fill"></i>Home</a>
  <a href="products.html"><i class="bi bi-box-seam"></i>Products</a>
  <a href="sales.html"><i class="bi bi-bar-chart-line"></i>Sales</a>
  <button onclick="toggleMenu()"><i class="bi bi-three-dots"></i>More</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/menu.js"></script>
<script>requireAdmin();</script>
</body>
</html>
